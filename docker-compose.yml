# Full local stack for the Observability & Log Analytics Data Platform.
#
#   docker compose up -d
#
# Services:
#   simulator   -> writes structured JSON logs to the shared ./data volume
#   vector      -> ships data/logs.jsonl to Kafka topic `raw_logs`
#   kafka       -> KRaft-mode Apache Kafka (buffer / backpressure layer)
#   clickhouse  -> analytical store; schema.sql is applied on first start
#   grafana     -> http://localhost:3001  (admin / admin) with the ClickHouse
#                  datasource + Service Health dashboard pre-provisioned
#
# The Next.js dashboard in this repo is separate: run `npm run dev` locally
# or deploy it to Vercel - it reads src/data/metrics.json produced by the
# file-based pipeline (pipeline/aggregate.py + pipeline/anomaly_detection.py).

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: observability-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: observability-cluster-1
    volumes:
      - kafka_data:/var/lib/kafka/data

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: observability-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    depends_on:
      - kafka

  simulator:
    image: python:3.12-slim
    container_name: observability-simulator
    working_dir: /app
    command: >
      python simulator/log_simulator.py --mode stream --minutes 0
      --interval 2 --out /data/logs.jsonl
    volumes:
      - ./simulator:/app/simulator:ro
      - ./data:/data

  vector:
    image: timberio/vector:0.39.0-debian
    container_name: observability-vector
    command: --config /etc/vector/vector.yaml
    volumes:
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
      - ./data:/data:ro
    depends_on:
      - kafka
      - simulator

  grafana:
    image: grafana/grafana:11.0.0
    container_name: observability-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - clickhouse

volumes:
  kafka_data:
  clickhouse_data:
  grafana_data:
